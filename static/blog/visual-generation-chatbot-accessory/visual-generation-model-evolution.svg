<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2042 430" role="img" aria-labelledby="title desc">
  <title id="title">Visual Generation Model Evolution</title>
  <desc id="desc">A four-stage diagram from CLIP-conditioned diffusion, to LLM or VLM conditioned diffusion and flow, to native multimodal autoregression, to hybrid autoregressive plus diffusion decoders.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#111827" flood-opacity="0.14"></feDropShadow>
    </filter>
  </defs>
  <rect width="2042" height="430" fill="#ffffff"></rect>
  <g fill="#e5e7eb">
    <rect x="392" y="94" width="116" height="18" rx="9"></rect>
    <path d="M 505 68 L 555 103 L 505 138 Z"></path>
    <rect x="930" y="94" width="104" height="18" rx="9"></rect>
    <path d="M 1030 68 L 1080 103 L 1030 138 Z"></path>
    <rect x="1454" y="94" width="94" height="18" rx="9"></rect>
    <path d="M 1545 68 L 1595 103 L 1545 138 Z"></path>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">
    <g filter="url(#shadow)">
      <rect x="34" y="35" width="348" height="140" rx="22" fill="#ffffff" stroke="#1f2937" stroke-width="4"></rect>
      <rect x="568" y="35" width="360" height="140" rx="22" fill="#ffffff" stroke="#1f2937" stroke-width="4"></rect>
      <rect x="1092" y="35" width="360" height="140" rx="22" fill="#ffffff" stroke="#1f2937" stroke-width="4"></rect>
      <rect x="1600" y="35" width="408" height="140" rx="22" fill="#ffffff" stroke="#1f2937" stroke-width="4"></rect>
    </g>
    <g fill="#111827" font-size="42" font-weight="500">
      <text x="208" y="95">Stable</text>
      <text x="208" y="145">Diffusion</text>
      <text x="748" y="92">FLUX.2 /</text>
      <text x="748" y="144">Qwen-Image-2.0</text>
      <text x="1272" y="92">HunyuanImage</text>
      <text x="1272" y="144">3.0</text>
      <text x="1804" y="92">GLM-Image</text>
      <text x="1804" y="144">Hybrid</text>
    </g>
    <g fill="#111827" font-size="31" font-weight="500">
      <text x="208" y="302">CLIP -&gt; Diffusion</text>
      <text x="748" y="288">LLM/VLM -&gt;</text>
      <text x="748" y="326">Diffusion / Flow</text>
      <text x="1272" y="288">Native Multimodal</text>
      <text x="1272" y="326">Autoregression</text>
      <text x="1804" y="288">Autoregressive +</text>
      <text x="1804" y="326">Diffusion Decoder</text>
    </g>
  </g>
</svg>