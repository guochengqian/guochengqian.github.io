<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 850" role="img" aria-labelledby="title desc">
  <title id="title">Visual reasoning gear placement example</title>
  <desc id="desc">A prompt asks where to place a gear to make a gearbox work, and the answer highlights a gear location in a spatial diagram.</desc>
  <rect width="1600" height="850" fill="#ffffff"></rect>
  <rect x="90" y="95" width="490" height="112" rx="18" fill="#ffffff" stroke="#edf0f3" stroke-width="2"></rect>
  <text x="118" y="145" font-family="-apple-system,BlinkMacSystemFont,&#39;Segoe UI&#39;,Roboto,Arial,sans-serif" font-size="36" fill="#0f2530">Where should I place this gear</text>
  <text x="118" y="188" font-family="-apple-system,BlinkMacSystemFont,&#39;Segoe UI&#39;,Roboto,Arial,sans-serif" font-size="36" fill="#0f2530">to make the gearbox work?</text>
  <rect x="92" y="255" width="230" height="230" rx="18" fill="#ffffff" stroke="#f3f4f6" stroke-width="2"></rect>
  <text x="95" y="708" font-family="-apple-system,BlinkMacSystemFont,&#39;Segoe UI&#39;,Roboto,Arial,sans-serif" font-size="36" fill="#0f2530">You should place the</text>
  <text x="95" y="760" font-family="-apple-system,BlinkMacSystemFont,&#39;Segoe UI&#39;,Roboto,Arial,sans-serif" font-size="36" fill="#0f2530">attached gear at </text>
  <text x="365" y="760" font-family="-apple-system,BlinkMacSystemFont,&#39;Segoe UI&#39;,Roboto,Arial,sans-serif" font-size="36" fill="#ef4f61">(0.74, 0.68).</text>

  <rect x="735" y="92" width="760" height="665" rx="20" fill="#ffffff" stroke="#e78b95" stroke-width="3"></rect>

  <defs>
    <g id="gear">
      <path d="M0,-54 L9,-38 L23,-48 L24,-30 L42,-35 L35,-18 L54,-14 L38,-3 L52,10 L33,15 L40,32 L22,28 L16,47 L3,33 L-10,51 L-15,31 L-34,39 L-28,20 L-49,17 L-33,4 L-52,-8 L-32,-14 L-40,-33 L-21,-27 L-13,-48 Z" fill="none" stroke="#eceff2" stroke-width="3" stroke-linejoin="round"></path>
      <circle cx="0" cy="0" r="6" fill="none" stroke="#eceff2" stroke-width="3"></circle>
    </g>
    <g id="gear-hot">
      <path d="M0,-54 L9,-38 L23,-48 L24,-30 L42,-35 L35,-18 L54,-14 L38,-3 L52,10 L33,15 L40,32 L22,28 L16,47 L3,33 L-10,51 L-15,31 L-34,39 L-28,20 L-49,17 L-33,4 L-52,-8 L-32,-14 L-40,-33 L-21,-27 L-13,-48 Z" fill="#fde2e5" stroke="#ef5b6b" stroke-width="3" stroke-linejoin="round"></path>
      <circle cx="0" cy="0" r="6" fill="none" stroke="#ef5b6b" stroke-width="3"></circle>
    </g>
  </defs>

  <g opacity="0.82">
    <use href="#gear" x="920" y="245" transform="scale(1.55)"></use>
    <use href="#gear" x="1070" y="210" transform="scale(1.1)"></use>
    <use href="#gear" x="1208" y="244" transform="scale(1.75)"></use>
    <use href="#gear" x="1370" y="236" transform="scale(1.6)"></use>
    <use href="#gear" x="820" y="374" transform="scale(1.0)"></use>
    <use href="#gear" x="1044" y="376" transform="scale(1.7)"></use>
    <use href="#gear" x="1230" y="375" transform="scale(1.08)"></use>
    <use href="#gear" x="1390" y="468" transform="scale(1.15)"></use>
    <use href="#gear" x="900" y="545" transform="scale(1.45)"></use>
    <use href="#gear" x="1035" y="660" transform="scale(1.0)"></use>
    <use href="#gear" x="1188" y="680" transform="scale(1.18)"></use>
    <use href="#gear" x="1088" y="540" transform="scale(0.82)"></use>
    <use href="#gear" x="1320" y="586" transform="scale(1.55)"></use>
    <use href="#gear-hot" x="1305" y="542" transform="scale(1.35)"></use>
  </g>
</svg>