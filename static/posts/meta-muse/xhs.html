<section>
<p>Meta超级智能实验室刚发布了两个新模型：Muse Image（已上线）和 Muse Video（早期预览）👀</p>

<p>最有意思的是 Muse Image——它不是简单的"文字生图"，而是一个会自己动脑的智能体：</p>

<p>✅ 会写代码，画出精确的图表和二维码<br>
✅ 会联网搜索，把画面对齐真实信息<br>
✅ 会自我检查、发现问题再重画</p>

<p>目前在图像竞技场排到第二名，已经在 Meta AI、Instagram、WhatsApp 里能玩了。视频版还在打磨音画同步和快速运动，坐等 🚀</p>
