  <title>
    Per-frame attention becomes cross-frame sliding-window attention
  </title>
  <desc>
    Each matrix cell is a pair of entire frame token blocks. Original per-frame
    attention permits only the diagonal blocks. Sliding-window attention
    additionally permits nearby-frame blocks, shown in light blue. No
    first-frame anchor is included in this diagram. The six frames and window
    width are illustrative.
  </desc>
